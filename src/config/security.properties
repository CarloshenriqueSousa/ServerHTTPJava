# Vaultra Secure Server - Configurações de Segurança
# ===================================================

# Expiração do token JWT em horas
jwt.expiracao.horas=24

# Caminho do arquivo da chave secreta JWT (gerado automaticamente)
jwt.secret.file=config/jwt_secret.key

# Caminho do arquivo de usuários (gerado automaticamente)
users.file=config/users.dat

# Rotas públicas (sem autenticação). Separadas por vírgula.
public.routes=/,/login,/favicon.ico,/api/health,/api/info

# Prefixos de rotas públicas
public.prefixes=/public/

# Limite máximo de requisições por minuto por IP
max.requests.per.minute=60
